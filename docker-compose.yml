services:
  app:
    build: .
    container_name: fms_app
    ports:
      - "8000:80"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: fms
      DB_USERNAME: fms
      DB_PASSWORD: secret
      FILESYSTEM_DISK: public
    volumes:
      - ./storage/app/public:/var/www/html/storage/app/public
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: fms_db
    environment:
      POSTGRES_DB: fms
      POSTGRES_USER: fms
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fms"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional: jalankan migrasi + seeder sekali pakai:
  # docker compose run --rm app php artisan migrate --seed --force

volumes:
  pgdata:
